<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    My GLP Shot mark.

    A countdown ring around a droplet: the ring fills clockwise from 12 o'clock
    like the time-to-next-shot dial on the app's home screen, and the droplet is
    the dose. Flat white on teal, three shapes, so it stays legible at 48px.
  -->
  <defs>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13a497"/>
      <stop offset="100%" stop-color="#0e7c72"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#ground)"/>

  <!-- Track and progress: three quarters of the cycle elapsed. -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="48"/>
  <path d="M 512.0 182.0 A 330 330 0 1 1 182.0 512.0" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="round"/>

  <!-- Dose: true teardrop, tangent sides into the round base. -->
  <path d="M 512 300 Q 586.0 399.8 638.7 499.6 A 150 150 0 1 1 385.3 499.6 Q 438.0 399.8 512 300 Z" fill="#fff"/>
</svg>
