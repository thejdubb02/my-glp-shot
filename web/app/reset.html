<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Reset password — My GLP Shot</title>
<link rel="icon" href="icons/favicon.ico">
<link rel="stylesheet" href="styles.css?v=18">
<script src="theme-boot.js"></script>
<style>body{padding:24px;max-width:480px;margin:40px auto;background:var(--bg);color:var(--ink)}</style>
</head>
<body>
<header class="app-header" style="margin:-24px -24px 24px;border-radius:0">
  <div class="brand"><span class="brand-mark">●</span> My GLP Shot</div>
  <a href="/" class="icon-btn">×</a>
</header>
<section class="card">
  <h2>Reset password</h2>
  <p class="muted small">Enter your email + new password. <strong>Important:</strong> resetting will erase your cloud-stored data, since we cannot decrypt it without your old password. Local data on each device is preserved.</p>
  <form id="reset-form" autocomplete="on">
    <label>Email <input id="reset-email" type="email" required autocomplete="email" autocapitalize="off"></label>
    <label>New password <input id="reset-pw" type="password" required minlength="8" autocomplete="new-password"></label>
    <p id="reset-status" class="sync-status"></p>
    <div class="modal-actions">
      <a href="/" class="btn-ghost">Cancel</a>
      <span class="spacer"></span>
      <button type="submit" class="btn-primary">Reset password</button>
    </div>
  </form>
</section>
<script src="data.js?v=430"></script>
<script src="app.js?v=430"></script>
<script src="reset.js?v=1"></script>
</body>
</html>
