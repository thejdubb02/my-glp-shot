<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Shared report — My GLP Shot</title>
<link rel="icon" href="/icons/favicon.ico">
<link rel="stylesheet" href="/styles.css?v=8">
<style>
  body{padding:14px}
  .doctor-banner{background:linear-gradient(90deg,#ccfbf1,#eefaf7);border-bottom:1px solid var(--line);padding:14px 18px;border-radius:0;margin:-14px -14px 18px}
  .doctor-banner strong{color:var(--bronze-dk)}
  .stat{display:inline-block;margin-right:18px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .stat strong{color:var(--bronze-dk);font-size:1.4rem;display:block}
  .stat span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
  th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{background:var(--surface-alt);color:var(--bronze-dk)}
  h2{color:var(--bronze-dk)}
  .err{color:var(--danger);text-align:center;padding:40px}
</style>
</head>
<body>
<div id="root">
  <p style="text-align:center;padding:40px">Loading…</p>
</div>
<script src="view.js?v=1"></script>
</body>
</html>
