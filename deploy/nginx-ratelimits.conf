# My GLP Shot admin API — bearer-token-gated, but bursty (dashboard fires
# several parallel fetches on load). Higher than login_limit, still tight.
limit_req_zone $binary_remote_addr zone=mglp_admin:10m rate=60r/m;
# ShotClock Sync — per-IP rate limit on the encrypted blob endpoint.
limit_req_zone $binary_remote_addr zone=shotclock_sync:10m rate=30r/m;
geo $rate_limit_bypass {
    default 0;
    98.45.105.35 1;       # Home IP
    73.222.194.104 1;     # Office IPv4
    2603:3024:14ad:5100:bc19:8dc1:420a:3164 1;  # Office IPv6
}

# Use empty zone key for whitelisted IPs (bypasses rate limiting)
map $rate_limit_bypass $rate_limit_key {
    0 $binary_remote_addr;
    1 "";
}

# Rate Limiting Zones
limit_req_zone $rate_limit_key zone=login_limit:10m rate=5r/m;
limit_req_zone $rate_limit_key zone=api_limit:10m rate=30r/m;
limit_req_zone $rate_limit_key zone=general_limit:10m rate=100r/m;
