# myglpshot.com — marketing landing page (the app lives at app.myglpshot.com)
# Backward compat: anyone with myglpshot.com installed as PWA is auto-redirected
# to the new /app/ subdirectory by the landing page detector.

server {
    server_name myglpshot.com;

    # Sync API — exposed at root domain too so PWAs that learned this URL keep working.
    location /api/ {
        limit_req zone=shotclock_sync burst=15 nodelay;
        client_max_body_size 4M;
        proxy_pass http://127.0.0.1:5012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Backward-compat: old PWA was served from / on this domain. Keep it working
    # under /app/ so installed instances still load (the SW + manifest at /app/).
    location /app/ {
        alias /opt/my-glp-shot/web/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        types {
            text/html                   html;
            text/css                    css;
            application/javascript      js;
            application/manifest+json   webmanifest;
            image/png                   png;
            image/svg+xml               svg;
            image/x-icon                ico;
            text/calendar               ics;
            application/json            json;
        }
    }

    # AI crawler manifests — noindex headers
    location = /llms.txt      { root /opt/my-glp-shot/web/landing; default_type text/plain; add_header X-Robots-Tag "noindex" always; }
    location = /llms-full.txt { root /opt/my-glp-shot/web/landing; default_type text/plain; add_header X-Robots-Tag "noindex" always; }

    # Marketing landing
    location / {
        root /opt/my-glp-shot/web/landing;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        types {
            text/html                   html;
            text/css                    css;
            application/javascript      js;
            image/png                   png;
            image/svg+xml               svg;
            image/jpeg                  jpg jpeg;
            image/x-icon                ico;
            text/plain                  txt;
            application/xml             xml;
            application/manifest+json   webmanifest;
        }
    }

    listen 187.77.19.181:443 ssl;
    listen [2a02:4780:4:cdb8::1]:443 ssl;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/myglpshot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/myglpshot.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.myglpshot.com) {
        return 301 https://myglpshot.com$request_uri;
    }
    if ($host = myglpshot.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name myglpshot.com www.myglpshot.com;
    return 404;
}

# HTTPS www → apex (301)
server {
    listen 187.77.19.181:443 ssl;
    listen [2a02:4780:4:cdb8::1]:443 ssl;
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.myglpshot.com;
    ssl_certificate /etc/letsencrypt/live/myglpshot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myglpshot.com/privkey.pem;
    return 301 https://myglpshot.com$request_uri;
}
