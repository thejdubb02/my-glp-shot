# app.myglpshot.com — the actual PWA. Static files served by nginx; /api/* proxied
# to the Dockerized backend on 127.0.0.1:5012.
# TLS will be added by certbot once DNS for app.myglpshot.com points to this host.

server {rewrite ^(/.well-known/acme-challenge/.*) $1 break; # managed by Certbot
    server_name app.myglpshot.com;

    # Tight throttle for credential endpoints — defends against brute-force.
    location ~ ^/api/(signup|login|forgot|reset)$ {
        limit_req zone=login_limit burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Read endpoints that take a token (share fetch, legacy lookup) — defend against enumeration.
    location ~ ^/api/(share|sync)/[a-f0-9]+ {
        limit_req zone=login_limit burst=10 nodelay;
        client_max_body_size 4M;
        proxy_pass http://127.0.0.1:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Smart Import calls Gemini per 120KB chunk; up to ~12 chunks at 1.5MB → allow up to 30min.
    location = /api/import/parse {
        limit_req zone=shotclock_sync burst=5 nodelay;
        client_max_body_size 4M;
        proxy_pass http://127.0.0.1:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        limit_req zone=shotclock_sync burst=15 nodelay;
        client_max_body_size 4M;
        proxy_pass http://127.0.0.1:5012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Service worker must never be cached by the browser, otherwise updates can't be detected.
    location = /sw.js {
        root /opt/my-glp-shot/web/app;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
        types { application/javascript js; }
    }

    # HTML is also no-store so the registered SW + script tags are always the latest set.
    location = /index.html {
        root /opt/my-glp-shot/web/app;
        add_header Cache-Control "no-store" always;
        include snippets/mgs-security-headers.conf;
        expires off;
    }
    location = / {
        root /opt/my-glp-shot/web/app;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        include snippets/mgs-security-headers.conf;
        expires off;
    }

    # Admin API — strict rate limit + small body cap. Must come before /api/ catch-all.
    location ^~ /api/admin/ {
        limit_req zone=mglp_admin burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Admin SPA — served from /admin/. Bearer-token-gated by the API itself.
    # Defense-in-depth: noindex, anti-clickjacking, strict CSP (no inline JS/CSS),
    # no referrers, no MIME-sniffing, no risky permissions.
    #
    # Framing is SAMEORIGIN / frame-ancestors 'self', not DENY / 'none': the PWA's
    # own Settings -> Open admin view embeds /admin/?embedded=1 in an iframe, and
    # DENY silently blanked it. Third-party framing is still refused, which is the
    # clickjacking case these headers exist for.
    location /admin/ {
        alias /opt/my-glp-shot/web/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
        # IP allowlist (uncomment + add your IPs to lock the SPA to your machines):
        #   allow 1.2.3.4;            # home
        #   allow 5.6.7.8;            # office/VPN
        #   deny all;
        types {
            text/html                   html;
            text/css                    css;
            application/javascript      js;
            image/png                   png;
            image/svg+xml               svg;
        }
    }
    # Allow /admin (no trailing slash) to redirect.
    location = /admin { return 301 /admin/; }

    # Marketing pages live on myglpshot.com. Without this, the PWA fallback
    # served the app at these URLs (200 + homepage canonical) and Google
    # treated them as extra copies of the app.
    location ~ ^/(compare|vs-shotsy|vs-careclinic|vs-myfitnesspal|vs-meagain|vs-glapp|vs-glippy|vs-pep|about|glossary|security)\.html$ {
        return 301 https://myglpshot.com$request_uri;
    }

    # Immutable assets: icons, vendored libraries and fonts. These change only
    # when their bytes change, so there is no reason to spend a revalidation
    # round-trip on them. Everything else keeps `no-cache` (revalidate), which
    # already returns 304 with an empty body.
    #
    # ^~ so this wins over the regex location below it, and over `location /`.
    location ^~ /lib/ {
        root /opt/my-glp-shot/web/app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        types { application/javascript js; }
    }

    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf)$ {
        root /opt/my-glp-shot/web/app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        root /opt/my-glp-shot/web/app;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/mgs-security-headers.conf;
        types {
            text/html                   html;
            text/css                    css;
            application/javascript      js;
            application/manifest+json   webmanifest;
            image/png                   png;
            image/svg+xml               svg;
            image/x-icon                ico;
            text/calendar               ics;
            application/json            json;
        }
    }
location = /.well-known/acme-challenge/LeCnJ3Vv4B83x63hzZD1c0F_0nPvE1IteEmEjKSu7aI{default_type text/plain;return 200 LeCnJ3Vv4B83x63hzZD1c0F_0nPvE1IteEmEjKSu7aI.ZofWUezN-RaGZ9gSKp5Nv8wPVnonc2YTMW0O0RqV1jk;} # managed by Certbot


    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    listen 187.77.19.181:443 ssl;
    listen [2a02:4780:4:cdb8::1]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/app.myglpshot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.myglpshot.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = app.myglpshot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot




    listen 80;
    listen [::]:80;
    listen 187.77.19.181:80;
    listen [2a02:4780:4:cdb8::1]:80;
    server_name app.myglpshot.com;
    return 404; # managed by Certbot


}