# Shared security headers for app.myglpshot.com.
#
# nginx's add_header does NOT inherit into a location block that adds any header
# of its own, so these are included per-location rather than set once at server
# level. Previously only `/` and `/index.html` carried a CSP, which left
# view.html — the doctor share page that renders patient-authored data — with no
# policy at all.
#
# script-src/connect-src include the self-hosted Umami host: it was omitted, so
# the analytics script was CSP-blocked and every track() call in the PWA was a
# no-op. `self` covers the app's own JS; Stripe needs its js.stripe.com script
# and api.stripe.com XHR; frame-src covers the Stripe payment iframes.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), serial=(), payment=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://analytics.willhitestrategy.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.stripe.com https://analytics.willhitestrategy.org; frame-src https://js.stripe.com https://hooks.stripe.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
